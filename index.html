<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Lyor Zhuang｜面試作戰台</title>
    <meta name="description" content="個人化半導體職缺面試準備、題庫與複盤工作台。">
    <!-- GitHub Pages: save this file as index.html in repository root -->
    <meta name="theme-color" content="#1f3654">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; manifest-src 'self';">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="面試攻防">
    <link rel="icon" type="image/jpeg" href="interview-app.jpg">
    <link rel="apple-touch-icon" href="interview-app.jpg">
    <link rel="manifest" href="manifest.webmanifest">
    
    <link rel="stylesheet" href="assets/tailwind.generated.css">
    <link rel="stylesheet" href="assets/app.css">
    <!-- Icons and fonts intentionally use local/system fallbacks for offline-safe Pages rendering. -->
    
</head>
<body class="text-slate-800 pb-28 selection:bg-slate-200">

    <aside id="archive-drawer" class="archive-drawer rounded-2xl p-3" aria-label="已結束面試紀錄" aria-hidden="true" inert>
        <div class="flex items-center justify-between px-2 pb-2"><p class="text-xs font-black text-slate-700">已結束面試</p><button data-action="toggle-archive" aria-label="關閉已結束面試紀錄" class="text-slate-400 hover:text-slate-700"><span data-icon="times" class=""></span></button></div>
        <button data-action="switch-company" data-company="assembly" data-close-archive="true" class="w-full text-left rounded-xl px-3 py-2 hover:bg-slate-100 text-sm font-bold text-slate-600">ASML Assembly <span class="float-right text-[10px] font-medium">已封存</span></button>
        <button data-action="switch-company" data-company="micron" data-close-archive="true" class="w-full text-left rounded-xl px-3 py-2 hover:bg-slate-100 text-sm font-bold text-slate-600">美光 <span class="float-right text-[10px] font-medium">已複盤</span></button>
        <button data-action="switch-company" data-company="swancor" data-close-archive="true" class="w-full text-left rounded-xl px-3 py-2 hover:bg-slate-100 text-sm font-bold text-slate-600">上緯 <span class="float-right text-[10px] font-medium">已複盤</span></button>
        <button data-action="switch-company" data-company="skyeuv" data-close-archive="true" class="w-full text-left rounded-xl px-3 py-2 hover:bg-slate-100 text-sm font-bold text-slate-600">天虹 <span class="float-right text-[10px] font-medium">已複盤</span></button>
    </aside>

    <div class="fixed bottom-6 right-6 z-50 flex flex-col gap-3 items-end fab-menu">
        <button data-action="scroll-top" aria-label="回到頁面頂端" class="w-12 h-12 bg-slate-800 text-white rounded-full shadow-lg flex items-center justify-center btn-press hover:bg-slate-700 transition">
            <span data-icon="arrowUp" class=""></span>
        </button>
    </div>

    <header class="sticky top-0 z-50 w-full bg-white shadow-sm shadow-slate-200/50 bg-white/95">
        <div class="h-1.5 w-full bg-gradient-to-r from-[#1f3654] via-[#91a48e] to-[#d9823b]"></div>
        
        <div class="px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <img src="interview-app.jpg" class="w-10 h-10 rounded-xl shadow-md object-cover" alt="Logo">
                <div>
                    <h1 class="text-lg font-black text-slate-900 tracking-tight leading-tight">終極面試攻防系統</h1>
                    <p class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mt-0.5">Lyor Zhuang • Multi-Offer Ready</p>
                </div>
            </div>
            <div class="flex gap-2"><button data-action="expand-all" aria-label="展開目前題庫" class="text-xs bg-slate-100 text-slate-600 px-3 py-1.5 rounded-lg font-bold hover:bg-slate-200 transition btn-press"><span data-icon="layer-group" class=""></span></button><button data-action="toggle-archive" aria-expanded="false" aria-controls="archive-drawer" class="text-xs bg-slate-100 text-slate-600 px-3 py-1.5 rounded-lg font-bold hover:bg-slate-200 transition btn-press">歷史紀錄</button></div>
        </div>
        
        <nav id="mobile-company-nav" class="mobile-company-nav flex px-1 border-b border-slate-200 overflow-x-auto hide-scrollbar" data-primary-company-nav="mobile" aria-label="公司導覽" role="tablist"></nav>
    </header>

    <main class="px-4 py-5 max-w-2xl mx-auto" id="main-container">

        <section id="dashboard" class="mb-6 space-y-4" aria-label="今日作戰台">
            <div class="workspace-hero rounded-3xl p-6 text-white shadow-lg">
                <p class="text-xs font-bold tracking-[.18em] text-[#d8e4d5]">INTERVIEW WORKSPACE</p>
                <h2 class="mt-2 text-2xl font-black">今天，練出穩定的自己。</h2>
                <p class="mt-2 text-sm leading-relaxed text-slate-200">先講結論，再用案例證明。你的主線是：設備排障、跨域整合、持續改善。</p>
                <div class="mt-5 border-t border-white/20 pt-4">
                    <div class="flex items-center justify-between"><h3 class="font-black">每次回答前的 3 個檢查</h3><span class="text-xs text-[#d8e4d5] font-bold">輸出校準</span></div>
                    <ol class="mt-3 space-y-2 text-sm leading-relaxed text-slate-100"><li><b class="mr-1 text-[#d8e4d5]">01</b>先用一句話講結論，避免「我覺得、應該、you know」。</li><li><b class="mr-1 text-[#d8e4d5]">02</b>講清楚自己怎麼觀察、分析與推動，不只說 Call Vendor。</li><li><b class="mr-1 text-[#d8e4d5]">03</b>尊重主管與團隊，再說明你如何以數據或現場事實提出建議。</li></ol>
                </div>
            </div>
        </section>

        <!-- ========================================================= -->
        <!--                      COMPANY 1: ASML                      -->
        <!-- ========================================================= -->
        <div id="section-lam" class="company-section block"></div>
        <div id="section-asml" class="company-section hidden"></div>

        <div id="section-assembly" class="company-section hidden"></div>
        <div id="section-fstech" class="company-section hidden"></div>
        <div id="section-benq" class="company-section hidden"></div>

        <div id="section-micron" class="company-section hidden"></div>
        <div id="section-swancor" class="company-section hidden"></div>
        <div id="section-skyeuv" class="company-section hidden"></div>

    </main>

    <script src="js/company-registry.js" defer></script>
    <script src="js/lam-bank.js" defer></script>
    <script src="js/app.js" defer></script>
    <script src="js/icons.js" defer></script>
    <script src="js/legacy-data.js" defer></script>
    <script src="js/legacy-id-map.js" defer></script>
    <script src="js/renderer.js" defer></script>
    <script src="js/legacy-sections.js" defer></script>
    <script src="js/state.js" defer></script>
</body>
</html>
